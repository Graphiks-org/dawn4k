name: Toolkit platform qualification

on:
  workflow_call:
    inputs:
      native-bundle-artifact:
        description: Verified Linux bundles produced by toolkit-native-bundles.yml in this workflow run
        required: true
        type: string

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: jvm-macosArm64
            backend: Metal
            android-tools: '15641748'
          - os: windows-2025
            target: jvm-mingwX64
            backend: D3D12
            android-tools: '16111833'
          - os: ubuntu-24.04
            target: jvm-linuxX64
            backend: Vulkan
            android-tools: '16111833'
          - os: ubuntu-24.04-arm
            target: jvm-linuxArm64
            backend: Vulkan
            # SDK Manager 21 runs on Java; Android CLI 23's Linux binary is x86_64.
            android-tools: '15641748'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: ${{ matrix.android-tools }}
          packages: ${{ matrix.target == 'jvm-linuxArm64' && 'platform-tools' || 'cmdline-tools;23.0 platform-tools' }}
      - name: Install Android platform
        if: runner.os != 'Windows' && matrix.target != 'jvm-linuxArm64'
        run: '"$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Install Android platform with Java SDK Manager on ARM64
        if: matrix.target == 'jvm-linuxArm64'
        run: '"$ANDROID_HOME/cmdline-tools/15641748/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Install Android platform (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:ANDROID_HOME\cmdline-tools\23.0\bin\sdkmanager.bat" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Set up Linux graphical Vulkan environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb weston \
            build-essential cmake pkg-config wayland-protocols libwayland-dev libxkbcommon-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Require JVM GPU and window execution
        run: python3 scripts/run-toolkit-platform-tests.py --kind desktop --target '${{ matrix.target }}' --backend '${{ matrix.backend }}'
      - name: Require Native Linux GPU and both window systems
        if: matrix.target == 'jvm-linuxX64'
        run: python3 scripts/run-toolkit-platform-tests.py --kind desktop --target linuxX64 --backend Vulkan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-coverage-${{ matrix.target }}
          path: build/toolkit-coverage/
          if-no-files-found: error

  apple:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # The Intel simulator uses an installed universal iOS 26 runtime.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15641748'
          packages: 'cmdline-tools;23.0 platform-tools'
      - name: Install Android platform and NDK
        run: '"$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.native-bundle-artifact }}
          path: build/publication-bundles
      - name: Configure verified foreign bundles
        run: |
          mkdir -p "$HOME/.gradle"
          echo "dawn.nativeBundle.linuxX64=$PWD/build/publication-bundles/dawn4k-native/build/dawnCarrier/linuxX64" >> "$HOME/.gradle/gradle.properties"
          echo "glfw.nativeBundle.linuxX64=$PWD/build/publication-bundles/dawn4k-toolkit-glfw/build/glfw/linuxX64" >> "$HOME/.gradle/gradle.properties"
      - name: Boot ARM64 Metal simulators
        if: matrix.arch == 'arm64'
        run: python3 scripts/boot-apple-simulators.py --env-file "$GITHUB_ENV"
      - name: Boot Intel iOS Metal simulator
        if: matrix.arch == 'x64'
        run: python3 scripts/boot-apple-simulators.py --platform iOS --env-file "$GITHUB_ENV"
      - name: Require Native macOS and ARM64 simulator GPU execution
        if: matrix.arch == 'arm64'
        run: |
          python3 scripts/run-toolkit-platform-tests.py --kind desktop --target macosArm64 --backend Metal
          python3 scripts/run-toolkit-platform-tests.py --kind apple --target iosSimulatorArm64 --backend Metal
          python3 scripts/run-toolkit-platform-tests.py --kind apple --target tvosSimulatorArm64 --backend Metal
          python3 scripts/run-toolkit-platform-tests.py --kind compile --target iosArm64 --backend Metal
          python3 scripts/run-toolkit-platform-tests.py --kind compile --target tvosArm64 --backend Metal
      - name: Require Intel simulator GPU execution
        if: matrix.arch == 'x64'
        run: python3 scripts/run-toolkit-platform-tests.py --kind apple --target iosX64 --backend Metal
      - name: Verify complete publication and coordinate consumers
        if: matrix.arch == 'arm64'
        run: |
          ./gradlew verifyToolkitPublication :dawn4k-native:jvmTest --no-daemon --stacktrace
          python3 scripts/verify-toolkit-consumers.py --maven-root "$HOME/.m2/repository"
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: toolkit-published-consumers
          path: build/toolkit-consumer-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-coverage-apple-${{ matrix.arch }}
          path: build/toolkit-coverage/
          if-no-files-found: error

  android:
    needs: apple
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: toolkit-published-consumers
          path: build/toolkit-consumer-artifacts
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature Vulkan
          disable-animations: true
          script: |
            python3 scripts/run-toolkit-platform-tests.py --kind android --target android --backend Vulkan
            python3 scripts/run-toolkit-consumer-artifacts.py --apk build/toolkit-consumer-artifacts/toolkit-consumer-minified.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-coverage-android
          path: build/toolkit-coverage/
          if-no-files-found: error

  published-linux:
    needs: apple
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: toolkit-published-consumers
          path: build/toolkit-consumer-artifacts
      - name: Install Vulkan and window systems
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb weston
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Require standalone Native Linux consumers
        run: python3 scripts/run-toolkit-consumer-artifacts.py --linux-directory build/toolkit-consumer-artifacts

  coverage:
    needs: [desktop, apple, android, published-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: toolkit-coverage-*
          path: build/toolkit-coverage
      - name: Reject missing, skipped or compile-only GPU coverage
        run: |
          python3 scripts/verify-toolkit-coverage.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          reports = sorted(Path('build/toolkit-coverage').rglob('summary.json'))
          command = ['python3', 'scripts/verify-toolkit-coverage.py']
          for report in reports:
              command += ['--report', str(report)]
          subprocess.run(command, check=True)
          PY

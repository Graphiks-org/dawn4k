name: Toolkit platform qualification

on:
  workflow_call:
    inputs:
      native-bundle-artifact:
        description: Verified Linux bundles produced by toolkit-native-bundles.yml in this workflow run
        required: true
        type: string

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: jvm-macosArm64
            backend: Metal
            android-tools: '15641748'
          - os: windows-2025
            target: jvm-mingwX64
            backend: D3D12
            android-tools: '16111833'
          - os: ubuntu-24.04
            target: jvm-linuxX64
            backend: Vulkan
            android-tools: '16111833'
          - os: ubuntu-24.04-arm
            target: jvm-linuxArm64
            backend: Vulkan
            # SDK Manager 21 runs on Java; Android CLI 23's Linux binary is x86_64.
            android-tools: '15641748'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: ./.github/actions/configure-android-sdk
        with:
          cmdline-tools-version: ${{ matrix.android-tools }}
          # ARM64 Linux cannot install the x86_64-only CLI 23 binary.
          bootstrapped-sdkmanager: ${{ matrix.target == 'jvm-linuxArm64' }}
      - name: Set up Linux graphical Vulkan environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb weston \
            build-essential cmake pkg-config wayland-protocols libwayland-dev libxkbcommon-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Require JVM GPU and window execution
        run: python3 scripts/run-toolkit-platform-tests.py --kind desktop --target '${{ matrix.target }}' --backend '${{ matrix.backend }}'
      - name: Require Native Linux GPU and both window systems
        if: matrix.target == 'jvm-linuxX64'
        run: python3 scripts/run-toolkit-platform-tests.py --kind desktop --target linuxX64 --backend Vulkan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-coverage-${{ matrix.target }}
          path: build/toolkit-coverage/
          if-no-files-found: error

  # The three GPU suites share one runner: the macos-26 pool serves this repository
  # three to five runners at a time and cancels anything queued past fifteen minutes,
  # so parallel legs starve unpredictably. Serialized they take ~30 minutes — well
  # under Tests (macos-26), which gates the run anyway — and the compile and
  # publication jobs then reuse the freed slot.
  apple:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      # The Intel simulator uses an installed universal iOS 26 runtime.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Android SDK
        uses: ./.github/actions/configure-android-sdk
        with:
          install-ndk: true
      - name: Configure verified foreign bundles
        uses: ./.github/actions/configure-linux-bundles
        with:
          artifact: ${{ inputs.native-bundle-artifact }}
      - name: Boot ARM64 Metal simulators
        run: python3 scripts/boot-apple-simulators.py --env-file "$GITHUB_ENV"
      - name: Require Native macOS and ARM64 simulator GPU execution
        run: |
          python3 scripts/run-toolkit-platform-tests.py --kind desktop --target macosArm64 --backend Metal
          python3 scripts/run-toolkit-platform-tests.py --kind apple --target iosSimulatorArm64 --backend Metal
          python3 scripts/run-toolkit-platform-tests.py --kind apple --target tvosSimulatorArm64 --backend Metal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-coverage-apple-gpu
          path: build/toolkit-coverage/
          if-no-files-found: error

  # Device-target compile checks: the same macOS toolchain work as the GPU suites but
  # no simulator. Staggered behind apple to cap simultaneous macOS runners — the pool
  # serves three to five at a time and cancels anything queued past fifteen minutes.
  apple-compile:
    needs: apple
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Android SDK
        uses: ./.github/actions/configure-android-sdk
        with:
          install-ndk: true
      - name: Configure verified foreign bundles
        uses: ./.github/actions/configure-linux-bundles
        with:
          artifact: ${{ inputs.native-bundle-artifact }}
      - name: Require device-target compilation
        run: |
          python3 scripts/run-toolkit-platform-tests.py --kind compile --target iosArm64 --backend Metal
          python3 scripts/run-toolkit-platform-tests.py --kind compile --target tvosArm64 --backend Metal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-coverage-apple-devices
          path: build/toolkit-coverage/
          if-no-files-found: error

  # The publication check is platform-independent work (publishToMavenLocal of every
  # variant plus Maven metadata verification); it stays on macOS because dawn4k-native
  # stages the darwin-aarch64 dylib the published JVM bootstrap loads. It also runs
  # behind apple to keep the simultaneous macOS runner count within the pool.
  apple-publication:
    needs: apple
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Android SDK
        uses: ./.github/actions/configure-android-sdk
        with:
          install-ndk: true
      - name: Configure verified foreign bundles
        uses: ./.github/actions/configure-linux-bundles
        with:
          artifact: ${{ inputs.native-bundle-artifact }}
      - name: Verify complete publication
        run: ./gradlew verifyToolkitPublication --no-daemon --stacktrace

  android:
    # Parallel to the apple suites: this job emulates an Android GPU and consumes
    # nothing they produce — only the final coverage gate needs both.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: ./.github/actions/configure-android-sdk
        with:
          cmdline-tools-version: '16111833'
          install-ndk: true
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature Vulkan
          disable-animations: true
          script: python3 scripts/run-toolkit-platform-tests.py --kind android --target android --backend Vulkan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-coverage-android
          path: build/toolkit-coverage/
          if-no-files-found: error

  coverage:
    needs: [desktop, apple, android, apple-compile, apple-publication]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: toolkit-coverage-*
          path: build/toolkit-coverage
      - name: Reject missing, skipped or compile-only GPU coverage
        run: |
          python3 scripts/verify-toolkit-coverage.py --self-test
          python3 scripts/verify-toolkit-coverage.py --report-dir build/toolkit-coverage

name: Toolkit native publication bundles

on:
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: ./.github/actions/configure-android-sdk
        with:
          cmdline-tools-version: '16111833'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config wayland-protocols \
            libwayland-dev libxkbcommon-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Build verified Linux publication bundles
        run: |
          python3 scripts/tests/test_dawn_linux_bundle.py
          ./gradlew :dawn4k-native:prepareLinuxDawnCarrier :dawn4k-toolkit-glfw:buildGlfwLinuxX64 \
            -Pdawn.targets=linuxX64 --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-linux-native-bundles
          path: |
            dawn4k-native/build/dawnCarrier/linuxX64/libdawn4k_dawn.a
            dawn4k-native/build/dawnCarrier/linuxX64/bundle.json
            dawn4k-toolkit-glfw/build/glfw/linuxX64/lib*.a
            dawn4k-toolkit-glfw/build/glfw/linuxX64/bundle.properties
          if-no-files-found: error

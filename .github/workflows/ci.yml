name: KMP Starter Pack CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: macos-26 # Xcode 26 is required by Compose Multiplatform 1.11.1 for the iOS link
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 1: Determine the test strategy (Deep vs Fast-Track)
      # Check whether the PR targets 'master' or the current branch is 'master'
      - name: Determine Test Strategy
        id: test-strategy
        run: |
          if [[ "${{ github.base_ref }}" == "master" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "strategy=deep" >> $GITHUB_OUTPUT
            echo "Running deep tests (All Targets) for master branch / merge request."
          else
            echo "strategy=fast-track" >> $GITHUB_OUTPUT
            echo "Running JVM Fast-Track tests only."
          fi

      # Step 2: Run Fast-Track tests (JVM only)
      # Runs when neither the PR base nor the current branch is 'master'
      - name: Run JVM Fast-Track Tests
        if: steps.test-strategy.outputs.strategy == 'fast-track'
        run: ./gradlew jvmTest --no-daemon --stacktrace

      - name: Boot Apple simulators for Metal tests
        if: steps.test-strategy.outputs.strategy == 'deep'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_boot_apple_simulators.py'
          python3 scripts/boot-apple-simulators.py --env-file "$GITHUB_ENV"

      # Step 3: Run Deep tests (JVM, Android, and iOS Simulator/Link)
      # Runs only for pushes to or pull requests targeting 'master'
      - name: Run Deep Tests (JVM, Android & iOS Simulator)
        if: steps.test-strategy.outputs.strategy == 'deep'
        run: ./gradlew allTests --no-daemon --stacktrace

  cpu-vulkan-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAWN_TEST_BACKEND: Vulkan
      DAWN_REQUIRE_ADAPTER: '1'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Android SDK for Gradle project import
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Install and select CPU Vulkan adapter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" vulkaninfo --summary

      - name: Run JVM and Linux Native tests with required CPU adapter
        run: |
          chmod +x gradlew
          ./gradlew :dawn4k:jvmTest :dawn4k:linuxX64Test --no-daemon --continue --stacktrace

      - name: Upload CPU test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-vulkan-test-reports
          path: |
            dawn4k/build/reports/tests/
            dawn4k/build/test-results/
          if-no-files-found: warn

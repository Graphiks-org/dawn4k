name: Deploy docs (Dokka MkDocs → MkDocs Material → Pages)

on:
  push:
    branches: [master, init] # Trigger on master or init for testing
    paths:
      - 'docs/**'
      - 'docs/mkdocs.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/toolkit-native-bundles.yml'
      - 'dawn4k*/src/**'
      - 'dawn4k-native/generated/src/**'
      - 'buildSrc/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'bindings/**'
      - 'scripts/normalize-toolkit-doc-links.py'
      - 'scripts/tests/test_toolkit_doc_links.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  native-bundles:
    uses: ./.github/workflows/toolkit-native-bundles.yml

  build:
    needs: native-bundles
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: ./.github/actions/configure-android-sdk
        with:
          install-ndk: true

      - name: Configure verified foreign native bundles
        uses: ./.github/actions/configure-linux-bundles
        with:
          artifact: toolkit-linux-native-bundles

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Install MkDocs Material + plugins
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-static-i18n

      - name: Generate and embed API docs (Dokka → MkDocs)
        run: |
          python3 scripts/tests/test_toolkit_doc_links.py
          ./gradlew --no-daemon :docs:verifyToolkitApiDocumentation

      - name: Build site (MkDocs)
        run: mkdocs build --strict -f docs/mkdocs.yml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

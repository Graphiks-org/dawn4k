name: Publish to Maven Central

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 2.0.0-SNAPSHOT). Default: 1.0.0-SNAPSHOT'
        required: false

jobs:
  snapshot:
    if: github.event_name == 'push' && github.ref_name == 'master' || github.event_name == 'workflow_dispatch'
    # Publication must run on macOS: the Apple cinterops cannot be processed on a
    # Linux host, so a Linux runner would silently drop every Apple variant.
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - name: Check publication credentials
        shell: bash
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing required publication credential: %s\n' "$name" >&2
              exit 1
            fi
          done
      - name: Set up Android SDK for Gradle project import
        uses: android-actions/setup-android@v3
        with:
          # setup-android cannot download the architecture-suffixed macOS 23 archive.
          # Bootstrap macOS with 21, then let sdkmanager install 23 from the catalog.
          cmdline-tools-version: '15641748'
          packages: 'cmdline-tools;23.0 platform-tools'
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Set snapshot version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: printf 'VERSION=%s\n' "${INPUT_VERSION:-1.0.0-SNAPSHOT}" >> "$GITHUB_ENV"
      - name: Publish snapshot
        # The task selector publishes every subproject that applies the publication
        # convention; the root project deliberately has no such task.
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon --stacktrace -PreleaseVersion="${VERSION}"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - name: Check publication credentials
        shell: bash
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing required publication credential: %s\n' "$name" >&2
              exit 1
            fi
          done
      - name: Set up Android SDK for Gradle project import
        uses: android-actions/setup-android@v3
        with:
          # setup-android cannot download the architecture-suffixed macOS 23 archive.
          # Bootstrap macOS with 21, then let sdkmanager install 23 from the catalog.
          cmdline-tools-version: '15641748'
          packages: 'cmdline-tools;23.0 platform-tools'
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Publish release
        # The task selector publishes every subproject that applies the publication
        # convention; the root project deliberately has no such task.
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon --stacktrace -PreleaseVersion=${{ env.VERSION }}

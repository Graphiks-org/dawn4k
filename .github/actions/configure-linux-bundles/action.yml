# Configures a runner to consume the verified Linux publication bundles built by
# .github/workflows/toolkit-native-bundles.yml:
#
# 1. downloads the bundle artifact (input `artifact`, e.g. `toolkit-linux-native-bundles`
#    or the `native-bundle-artifact` input forwarded by a calling reusable workflow)
#    into `build/publication-bundles`;
# 2. appends the `dawn.nativeBundle.linuxX64` / `glfw.nativeBundle.linuxX64` pointers to
#    `$GRADLE_USER_HOME/gradle.properties` (default `~/.gradle`), honouring the
#    GRADLE_USER_HOME environment variable. The ci.yml Python heredoc that used to be
#    copied across the workflows is the reference implementation; the former bash copies
#    wrote the same two property lines into `$HOME/.gradle`, which equals the
#    GRADLE_USER_HOME default on GitHub runners.
#
# Linux runners configure their own graphical Vulkan environment (lavapipe ICD, Xvfb,
# Weston, build toolchain) in their own workflow steps, because each Linux job needs a
# different companion package set; see ci.yml and toolkit-platforms.yml.

name: Configure Linux native bundles
description: >-
  Download the verified Linux publication bundles and point Gradle at them via
  $GRADLE_USER_HOME/gradle.properties.

inputs:
  artifact:
    description: >-
      Name of the bundle artifact uploaded by toolkit-native-bundles.yml
      (toolkit-linux-native-bundles).
    required: true

runs:
  using: composite
  steps:
    - name: Download verified Linux publication bundles
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: build/publication-bundles

    - name: Point Gradle at the verified Linux bundles
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        root = Path('build/publication-bundles').resolve()
        gradle_home = Path(os.environ.get('GRADLE_USER_HOME', Path.home() / '.gradle'))
        gradle_home.mkdir(parents=True, exist_ok=True)
        with (gradle_home / 'gradle.properties').open('a', encoding='utf-8') as output:
            dawn = (root / 'dawn4k-native/build/dawnCarrier/linuxX64').as_posix()
            glfw = (root / 'dawn4k-toolkit-glfw/build/glfw/linuxX64').as_posix()
            output.write(f'\ndawn.nativeBundle.linuxX64={dawn}\n')
            output.write(f'glfw.nativeBundle.linuxX64={glfw}\n')
        PYTHON

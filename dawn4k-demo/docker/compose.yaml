name: dawn4k-linux-desktop
x-cache: &cache
  type: volume
  volume:
    nocopy: true
services:
  desktop:
    platform: linux/arm64
    build: .
    init: true
    ports:
      - "127.0.0.1:${DAWN_DESKTOP_PORT:-6080}:6080"
    working_dir: /workspace
    shm_size: 512m
    environment:
      DAWN_DESKTOP_BACKEND: x11
    volumes:
      - type: bind
        source: ../..
        target: /workspace
      - { <<: *cache, source: gradle-home, target: /home/demo/.gradle }
      - { <<: *cache, source: root-gradle, target: /workspace/.gradle }
      - { <<: *cache, source: root-kotlin, target: /workspace/.kotlin }
      - { <<: *cache, source: root-build, target: /workspace/build }
      - { <<: *cache, source: buildsrc-gradle, target: /workspace/buildSrc/.gradle }
      - { <<: *cache, source: buildsrc-build, target: /workspace/buildSrc/build }
      - { <<: *cache, source: native-build, target: /workspace/dawn4k-native/build }
      - { <<: *cache, source: dawn-build, target: /workspace/dawn4k/build }
      - { <<: *cache, source: demo-build, target: /workspace/dawn4k-demo/build }
      - { <<: *cache, source: docs-build, target: /workspace/docs/build }
    healthcheck:
      test: ["CMD", "gosu", "demo", "python3", "/opt/demo/check-desktop.py"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  gradle-home:
  root-gradle:
  root-kotlin:
  root-build:
  buildsrc-gradle:
  buildsrc-build:
  native-build:
  dawn-build:
  demo-build:
  docs-build:

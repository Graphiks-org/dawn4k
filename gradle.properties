# JVM Arguments
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
# JDK 24+ (JEP 472) warns when the Kotlin/Native embeddable compiler loads its native
# libraries over JNI inside cinterop tasks; grant it native access like the test JVMs.
kotlin.native.jvmArgs=--enable-native-access=ALL-UNNAMED

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true



# Maven Central Publication placeholders (Override in ~/.gradle/gradle.properties)
# Generate token at https://central.sonatype.com -> Account -> User Token
# mavenCentralUsername=YOUR_TOKEN_USERNAME
# mavenCentralPassword=YOUR_TOKEN_PASSWORD
# signingInMemoryKey=YOUR_GPG_SECRET_KEY
# signingInMemoryKeyPassword=YOUR_GPG_PASSWORD
